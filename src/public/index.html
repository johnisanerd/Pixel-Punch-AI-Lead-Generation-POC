<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LeadRadar</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">LeadRadar</div>
    <div id="user-info" class="muted"></div>
  </header>

  <section class="toolbar">
    <label>
      Project
      <select id="project-select"></select>
    </label>
    <form id="new-project-form" class="inline-form">
      <input name="name" placeholder="New project name" required />
      <input name="icp" placeholder="ICP (optional)" />
      <button type="submit">New project</button>
    </form>
  </section>

  <section id="bypass-banner" class="banner hidden">
    Auth bypass active (<code>LEADRADAR_AUTH_BYPASS=1</code>)
  </section>

  <section id="kpis" class="kpis">
    <div class="kpi"><span class="kpi-label">Total leads</span><span id="kpi-total" class="kpi-value">—</span></div>
    <div class="kpi"><span class="kpi-label">New this week</span><span id="kpi-new" class="kpi-value">—</span></div>
    <div class="kpi"><span class="kpi-label">Approval rate</span><span id="kpi-approval" class="kpi-value">—</span></div>
    <div class="kpi"><span class="kpi-label">Reply rate</span><span id="kpi-reply" class="kpi-value">—</span></div>
  </section>

  <section class="actions">
    <button id="btn-score" type="button">Run scoring</button>
    <button id="btn-export-all" type="button">Export All</button>
    <button id="btn-export-emails" type="button">Export Emails</button>
    <label class="file-btn">
      Import CSV
      <input id="import-file" type="file" accept=".csv,text/csv" hidden />
    </label>
    <span id="action-status" class="muted"></span>
  </section>

  <section class="filters">
    <label>
      Status
      <select id="filter-status">
        <option value="">All</option>
        <option value="gated">gated</option>
        <option value="scored">scored</option>
        <option value="approved">approved</option>
        <option value="rejected">rejected</option>
      </select>
    </label>
    <label>
      Min score
      <input id="filter-min-score" type="number" min="0" max="100" placeholder="0" />
    </label>
    <label>
      Search
      <input id="filter-q" type="search" placeholder="Company…" />
    </label>
    <button id="btn-filter" type="button">Apply</button>
  </section>

  <main class="main">
    <div class="table-wrap">
      <table id="leads-table">
        <thead>
          <tr>
            <th>Company</th>
            <th>Email</th>
            <th>Score</th>
            <th>Status</th>
            <th>Sources</th>
          </tr>
        </thead>
        <tbody id="leads-body"></tbody>
      </table>
    </div>
    <aside id="detail" class="detail">
      <h2>Lead detail</h2>
      <p class="muted" id="detail-empty">Select a lead</p>
      <div id="detail-body" class="hidden">
        <h3 id="detail-company"></h3>
        <p id="detail-meta" class="muted"></p>
        <pre id="detail-reasons"></pre>
        <div class="detail-actions">
          <button id="btn-approve" type="button" class="ok">Approve</button>
          <button id="btn-reject" type="button" class="bad">Reject</button>
        </div>
        <label>
          Notes
          <input id="detail-notes" type="text" placeholder="Optional notes" />
        </label>
      </div>
    </aside>
  </main>

  <script src="/app.js" type="module"></script>
</body>
</html>
